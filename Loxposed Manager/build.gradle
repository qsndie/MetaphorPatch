apply plugin: 'com.android.application'

android {
    namespace = 'nea.lox'
    compileSdkVersion 34
    
    defaultConfig {
        applicationId "nea.lox"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}